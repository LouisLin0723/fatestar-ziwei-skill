<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">FateStar Ziwei for AI agents</title>
  <desc id="desc">A preview of the free hosted Zi Wei Dou Shu Agent Skill, MCP server, and REST API.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080d"/>
      <stop offset="0.55" stop-color="#0c0d17"/>
      <stop offset="1" stop-color="#090a10"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(320 170) rotate(24) scale(520 390)">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(1050 500) rotate(180) scale(420 300)">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171925"/>
      <stop offset="1" stop-color="#0e0f17"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#violetGlow)"/>
  <rect width="1280" height="640" fill="url(#blueGlow)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <g font-family="Aptos Display, Bahnschrift, Segoe UI Variable, sans-serif">
    <g transform="translate(72 58)">
      <circle cx="18" cy="18" r="18" fill="#f4c95d" fill-opacity="0.12"/>
      <path d="M18 5.5l2.7 8.1 8.3 2.7-8.3 2.7-2.7 8.1-2.7-8.1L7 16.3l8.3-2.7L18 5.5z" fill="#f4c95d"/>
      <text x="50" y="25" fill="#f7f7fb" font-size="25" font-weight="650" letter-spacing="0.2">FateStar Ziwei</text>
    </g>

    <g transform="translate(72 126)">
      <rect width="300" height="34" rx="17" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="18" cy="17" r="4" fill="#7dd3fc"/>
      <text x="32" y="22" fill="#cbd5e1" font-size="14" font-weight="600" letter-spacing="1.35">OFFICIAL MCP REGISTRY · LISTED</text>
    </g>

    <text x="72" y="230" fill="#ffffff" font-size="64" font-weight="720" letter-spacing="-2.2">Zi Wei Dou Shu</text>
    <text x="72" y="288" fill="url(#accent)" font-size="42" font-weight="640" letter-spacing="-0.8">紫微斗数 for AI agents.</text>

    <text x="72" y="350" fill="#b7bac8" font-size="23" font-weight="430">Free natal charts and six-level transits.</text>
    <text x="72" y="386" fill="#b7bac8" font-size="23" font-weight="430">No local server. No signup. No API key.</text>

    <g transform="translate(72 432)" font-size="16" font-weight="620">
      <g>
        <rect width="128" height="42" rx="21" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="24" y="27" fill="#ececf3">Agent Skill</text>
      </g>
      <g transform="translate(142 0)">
        <rect width="143" height="42" rx="21" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="23" y="27" fill="#ececf3">Hosted MCP</text>
      </g>
      <g transform="translate(299 0)">
        <rect width="116" height="42" rx="21" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="25" y="27" fill="#ececf3">REST API</text>
      </g>
    </g>

    <text x="72" y="558" fill="#8f93a7" font-size="18" font-weight="500">github.com/LouisLin0723/fatestar-ziwei</text>

    <g transform="translate(714 74)" filter="url(#softShadow)">
      <rect width="494" height="492" rx="34" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
      <rect x="8" y="8" width="478" height="476" rx="27" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>

      <circle cx="38" cy="38" r="5" fill="#fb7185"/>
      <circle cx="56" cy="38" r="5" fill="#fbbf24"/>
      <circle cx="74" cy="38" r="5" fill="#4ade80"/>
      <text x="102" y="44" fill="#777b90" font-size="13" font-weight="600" letter-spacing="1.2">LIVE ANONYMOUS RESULT</text>

      <rect x="28" y="76" width="438" height="86" rx="18" fill="#0a0b11" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="48" y="104" fill="#8b92a8" font-size="13" font-weight="600">YOU</text>
      <text x="48" y="130" fill="#e8e9f0" font-size="16" font-weight="500">Create my chart, then show the</text>
      <text x="48" y="151" fill="#e8e9f0" font-size="16" font-weight="500">2026 transits.</text>

      <g transform="translate(28 190)">
        <text x="0" y="18" fill="#8b92a8" font-size="13" font-weight="600">FATESTAR</text>

        <circle cx="9" cy="53" r="9" fill="#34d399" fill-opacity="0.14"/>
        <path d="M5 53l2.5 2.5L13 50" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="28" y="59" fill="#f1f2f6" font-size="19" font-weight="610">12 palaces</text>

        <circle cx="9" cy="91" r="9" fill="#34d399" fill-opacity="0.14"/>
        <path d="M5 91l2.5 2.5L13 88" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="28" y="97" fill="#f1f2f6" font-size="19" font-weight="610">102-star engine</text>

        <circle cx="9" cy="129" r="9" fill="#34d399" fill-opacity="0.14"/>
        <path d="M5 129l2.5 2.5L13 126" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="28" y="135" fill="#f1f2f6" font-size="19" font-weight="610">6 transit levels</text>

        <rect x="0" y="163" width="438" height="82" rx="17" fill="#7c3aed" fill-opacity="0.095" stroke="#a78bfa" stroke-opacity="0.17"/>
        <text x="18" y="193" fill="#c4b5fd" font-size="14" font-weight="650" letter-spacing="0.7">LIFE PALACE · 己卯</text>
        <text x="18" y="222" fill="#f0eefe" font-size="20" font-weight="610">廉贞（平） · 破军（陷）</text>
      </g>

      <line x1="28" y1="452" x2="466" y2="452" stroke="#ffffff" stroke-opacity="0.07"/>
      <circle cx="38" cy="469" r="4" fill="#60a5fa"/>
      <text x="50" y="475" fill="#7f8499" font-size="13" font-weight="520">https://www.fatestar.top/api/mcp</text>
    </g>
  </g>
</svg>
